name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Test the catalog against the authored scenarios
        run: go test -mod=readonly ./packages/api/... ./tests/...
      - name: Exercise the packaged API
        run: |
          docker build -f docker/api.Dockerfile -t incident-api:ci .
          docker run -d --name catalog --read-only -p 127.0.0.1:8080:8080 incident-api:ci
          trap 'docker rm -f catalog' EXIT
          tests/e2e/catalog.sh http://127.0.0.1:8080
          docker cp catalog:/incident-api "$RUNNER_TEMP/incident-api"
          python3 tests/e2e/server_lifecycle.py "$RUNNER_TEMP/incident-api"

  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      - run: bun run build
